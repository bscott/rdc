name: CI

on:
  push:
    branches: [main, "release/**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bin: rdc
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bin: rdc
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            bin: rdc.exe
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libclang-dev libxcb1-dev libxcb-randr0-dev libxcb-shm0-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev \
            libxkbcommon-dev libgbm-dev

      - name: rustfmt
        if: matrix.name == 'linux-x86_64'
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --release --target ${{ matrix.target }} --all-targets

      - name: test
        run: cargo test --release --target ${{ matrix.target }}

      - name: build
        run: cargo build --release --target ${{ matrix.target }}

      - name: third-party licenses
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: generate third-party license bundle
        shell: bash
        run: cargo about generate about.hbs -o THIRD_PARTY_LICENSES.html

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          out=rdc-${{ matrix.name }}
          mkdir -p dist/$out
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/$out/
          cp README.md LICENSE SECURITY.md CONTRIBUTING.md CHANGELOG.md THIRD_PARTY_LICENSES.html dist/$out/
          cp -r skills docs dist/$out/
          if [ "${{ runner.os }}" = "Windows" ]; then
            (cd dist && 7z a -tzip $out.zip $out >/dev/null)
          else
            if [ "${{ runner.os }}" = "macOS" ]; then cp -r scripts dist/$out/; fi
            tar -C dist -czf dist/$out.tar.gz $out
          fi
          ls -la dist

      - uses: actions/upload-artifact@v5
        with:
          name: rdc-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/checkout@v5
        with:
          path: src

      - name: release notes from CHANGELOG.md
        run: src/scripts/release-notes.sh "${GITHUB_REF_NAME}" src/CHANGELOG.md > RELEASE_NOTES.md && cat RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
