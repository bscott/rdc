[package]
name = "rdc"
version = "0.3.0"
edition = "2024"
description = "Remote Desktop Control: let an AI agent see and drive another machine's desktop over Tailscale"
license = "GPL-3.0-or-later"
repository = "https://github.com/bscott/rdc"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["json", "query", "macros"] }
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xcap = "0.9"
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
enigo = { version = "0.6", default-features = false, features = ["wayland", "x11rb"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
tailscale-localapi = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
enigo = { version = "0.6", default-features = false }
tailscale-localapi = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication"] }

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6", default-features = false }
tailscale-localapi = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
] }

[profile.release]
lto = "thin"
strip = true
